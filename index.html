<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>水下考古潜次封存与标记复核台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; }
    h2 { font-size: 16px; margin: 2px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #64777b; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    textarea { min-height: 56px; }
    label { display: block; margin: 8px 0 4px; color: #5c7378; font-size: 13px; }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .header-actions label { margin: 0; display: flex; align-items: center; gap: 6px; }
    .header-actions select { width: auto; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; }
    .map-panel { display: grid; grid-template-rows: auto 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toolbar.three { grid-template-columns: 1fr 1fr 1fr; }
    form .toolbar { margin-top: 10px; }
    .map { position: relative; height: calc(100vh - 210px); min-height: 500px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.pend-add { border-style: dashed; }
    .marker.pend-chg { box-shadow: 0 0 0 3px rgba(230,220,245,.95), 0 4px 12px rgba(0,0,0,.35); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .side { display: grid; gap: 16px; align-content: start; max-height: calc(100vh - 120px); overflow: auto; }
    .dives { display: grid; gap: 8px; max-height: 320px; overflow: auto; margin-bottom: 8px; }
    .dive-card { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; display: grid; gap: 3px; cursor: pointer; }
    .dive-card.selected { border-color: #1d6c78; background: #eef8f9; }
    .dive-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .dive-actions { margin-top: 4px; }
    .dive-actions button { padding: 7px 10px; font-size: 13px; }
    .pill { display: inline-block; padding: 3px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; }
    .pill.st-planned { background: #eceff1; }
    .pill.st-active { background: #d7f0e3; }
    .pill.st-pending_seal { background: #fff3c4; }
    .pill.st-pending_review { background: #e6dcf5; }
    .pill.st-confirmed { background: #cfe6f5; }
    .pill.warn { background: #f8d7da; border-color: #e3a7ad; }
    .pill.review { background: #e6dcf5; border-color: #c4b3e0; }
    .muted { color: #5c7378; font-size: 13px; }
    .danger { color: #a33; font-weight: 700; }
    .gate { color: #a33; font-size: 12px; }
    .review-text { color: #725ca6; font-weight: 700; }
    .hint { font-size: 12px; color: #8a6d1f; min-height: 15px; margin-top: 6px; }
    .hint.bad { color: #a33; }
    .diff { font-size: 12px; color: #725ca6; margin-top: 4px; }
    .list { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 10px; cursor: pointer; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .timeline { display: grid; gap: 8px; max-height: 300px; overflow: auto; }
    .timeline .item { cursor: default; }
    .events { display: grid; gap: 2px; margin: 6px 0; }
    .tl-marks { border-top: 1px dashed #d7e4e5; padding-top: 6px; display: grid; gap: 3px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #183035; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.25); z-index: 10; max-width: 82vw; font-size: 14px; }
    .toast.error { background: #8c2f39; }
    .hidden { display: none !important; }
    #newDiveBtn { width: 100%; }
    #diveForm { margin-top: 8px; border-top: 1px dashed #d7e4e5; padding-top: 6px; }
    @media (max-width: 980px) {
      header { display: block; }
      .header-actions { margin-top: 10px; }
      .app { grid-template-columns: 1fr; }
      .map { height: 520px; }
      .side { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>水下考古潜次封存与标记复核台</h1>
      <div class="muted">潜次双人绑定与持证深度校验 · 封存后另一人复核 · 确认前显示原值</div>
    </div>
    <div class="header-actions">
      <label>当前身份 <select id="userSelect"></select></label>
      <button id="exportBtn">导出JSON</button>
      <button id="resetBtn" class="secondary">重置示例</button>
    </div>
  </header>
  <main class="app">
    <section class="panel map-panel">
      <div class="toolbar three">
        <select id="filterType">
          <option value="">全部类型</option>
          <option value="ceramic">陶片</option>
          <option value="wood">木构件</option>
          <option value="metal">金属件</option>
          <option value="unknown">未知物</option>
        </select>
        <select id="filterDive"><option value="">全部潜次</option></select>
        <select id="view">
          <option value="list">标记列表</option>
          <option value="timeline">潜次时间线</option>
        </select>
      </div>
      <div class="map" id="map"><div class="wreck"></div></div>
    </section>
    <aside class="panel side">
      <section>
        <h2>潜次</h2>
        <div id="diveList" class="dives"></div>
        <button id="newDiveBtn" type="button" class="secondary">新建潜次</button>
        <form id="diveForm" class="hidden">
          <label>潜次编号</label>
          <input name="code" required placeholder="例如 DIVE-04">
          <label>潜水员 A</label>
          <select name="diverAId"></select>
          <label>潜水员 B</label>
          <select name="diverBId"></select>
          <label>计划深度（m）</label>
          <input name="plannedDepth" type="number" min="1" step="0.1" required placeholder="例如 18">
          <div class="hint" id="diveHint"></div>
          <div class="toolbar">
            <button>创建潜次</button>
            <button type="button" id="cancelDiveBtn" class="secondary">取消</button>
          </div>
        </form>
      </section>
      <section>
        <h2>标记信息</h2>
        <form id="form">
          <input name="markerId" type="hidden">
          <label>所属潜次</label>
          <select name="diveId"></select>
          <label>编号</label>
          <input name="code" required>
          <label>类型</label>
          <select name="type">
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
          <label>深度（m）</label>
          <input name="depth" type="number" min="0" step="0.1" placeholder="例如 18.4">
          <label>朝向</label>
          <input name="orientation" placeholder="例如 东北偏北">
          <label>保存状态</label>
          <input name="condition" placeholder="例如 表面附着贝类">
          <label>备注</label>
          <textarea name="note"></textarea>
          <div class="hint" id="markerHint"></div>
          <div class="toolbar">
            <button id="saveMarkerBtn">保存标记</button>
            <button type="button" id="deleteBtn" class="secondary">删除</button>
          </div>
        </form>
      </section>
      <section>
        <h2 id="listTitle">标记列表</h2>
        <div id="list" class="list"></div>
      </section>
    </aside>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
