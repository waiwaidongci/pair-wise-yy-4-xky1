<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>潜次封存与标记复核台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #e8f2f3; color: #183035; }
    header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #c9dadc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0 0 2px; font-size: 24px; }
    h2 { margin: 6px 0; font-size: 17px; }
    h3 { margin: 14px 0 6px; font-size: 14px; color: #3d5a60; }
    button { border: 0; border-radius: 8px; padding: 9px 13px; background: #1d6c78; color: #fff; font-weight: 800; cursor: pointer; }
    button:hover:not(:disabled) { background: #15565f; }
    button:disabled { background: #a9bdc0; cursor: not-allowed; }
    button.secondary { background: #64777b; }
    button.small { padding: 6px 10px; font-size: 13px; }
    input, select, textarea { width: 100%; border: 1px solid #c9dadc; border-radius: 6px; padding: 8px; font: inherit; background: #fff; }
    textarea { min-height: 54px; }
    label { display: block; margin: 8px 0 4px; color: #5c7378; font-size: 13px; }
    .app { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px; align-items: start; }
    .panel { background: #fff; border: 1px solid #c9dadc; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .map-wrap { position: sticky; top: 16px; }
    .map { position: relative; height: calc(100vh - 150px); min-height: 520px; overflow: hidden; background: radial-gradient(circle at 30% 20%, #5fa8b1, #0f5262 55%, #07333f); border-radius: 8px; border: 1px solid #0c4451; cursor: crosshair; }
    .wreck { position: absolute; left: 24%; top: 28%; width: 52%; height: 31%; border: 3px solid rgba(220,235,224,.55); border-radius: 48% 44% 42% 50%; transform: rotate(-9deg); }
    .rib { position: absolute; width: 2px; height: 36%; background: rgba(220,235,224,.35); top: 27%; transform: rotate(-9deg); }
    .marker { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,.7); box-shadow: 0 4px 12px rgba(0,0,0,.35); cursor: pointer; padding: 0; }
    .marker.selected { outline: 4px solid rgba(255,234,124,.75); }
    .marker.changed { border-color: #ffb547; outline: 4px solid rgba(255,181,71,.55); }
    .ceramic { background: #b56c38; } .wood { background: #6c4b2f; } .metal { background: #6e7880; } .unknown { background: #725ca6; }
    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .header-actions select { width: auto; min-width: 210px; }
    .dive-list { display: grid; gap: 8px; max-height: 230px; overflow: auto; }
    .list { display: grid; gap: 8px; max-height: 360px; overflow: auto; }
    .timeline { display: grid; gap: 8px; max-height: 460px; overflow: auto; }
    .item { border: 1px solid #d7e4e5; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
    .item:hover { border-color: #8fb6bb; }
    .item.active { border-color: #1d6c78; background: #eef8f9; }
    .pill { display: inline-block; padding: 2px 8px; border: 1px solid #c9dadc; border-radius: 999px; font-size: 12px; margin: 1px 2px; }
    .pill.warn { border-color: #d98a2b; color: #a35c08; background: #fdf3e7; }
    .pill.changed { border-color: #d98a2b; color: #a35c08; background: #fdf3e7; }
    .status-planning { background: #eef1f3; color: #56636b; }
    .status-open { background: #e7f4ea; color: #1d6b39; border-color: #bfe2ca; }
    .status-sealed { background: #fdf3e7; color: #a35c08; border-color: #f0cf9e; }
    .status-reviewed { background: #e8f0fb; color: #1d4d8b; border-color: #bccfe9; }
    .muted { color: #5c7378; font-size: 13px; }
    .blocked { margin: 8px 0; padding: 8px 10px; border-radius: 6px; background: #fdeceb; border: 1px solid #eeb7b2; color: #8d2a22; font-size: 13px; }
    .frozen { margin: 6px 0; padding: 7px 9px; border-radius: 6px; background: #fdf3e7; border: 1px solid #f0cf9e; font-size: 13px; }
    .frozen.ok { background: #e8f0fb; border-color: #bccfe9; color: #1d4d8b; }
    .checklist { margin: 6px 0; padding-left: 18px; font-size: 13px; }
    .checklist li { margin: 2px 0; color: #a35c08; }
    .checklist li.ok { color: #1d6b39; list-style: none; margin-left: -14px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .btn-row button { flex: 1; min-width: 150px; }
    .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .plan-grid label:last-child { grid-column: 1 / -1; }
    .mini-marks { display: grid; gap: 6px; }
    .mini-mark { border: 1px solid #d7e4e5; border-radius: 6px; padding: 6px 9px; cursor: pointer; font-size: 13px; }
    .mini-mark.active { border-color: #1d6c78; background: #eef8f9; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .pos-row { display: none; }
    .events { margin: 6px 0; display: grid; gap: 3px; }
    .event { font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
    .event .muted { white-space: nowrap; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); padding: 10px 18px; border-radius: 999px; color: #fff; font-weight: 700; opacity: 0; pointer-events: none; transition: all .25s; max-width: 80vw; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 10; font-size: 14px; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { background: #1d6c78; }
    .toast.err { background: #a33a30; }
    @media (max-width: 1020px) { .app { grid-template-columns: 1fr; } .map-wrap { position: static; } .map { height: 480px; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>潜次封存与标记复核台</h1>
      <div class="muted">准入检查 → 潜次登记 → 封存原值 → 另一人复核；筛选、时间线与导出刷新后保持一致。</div>
    </div>
    <div class="header-actions">
      <select id="operator" title="当前操作人（封存人与复核人按此记录）"></select>
      <button id="exportBtn">导出JSON</button>
    </div>
  </header>

  <main class="app">
    <section class="panel map-wrap">
      <div class="map" id="map"><div class="wreck"></div></div>
      <p class="muted" style="margin:8px 2px 0">点击沉船平面图放置新标记。橙色描边表示“封存后有新增/更正、等待复核”，此时标记仍显示原值。</p>
    </section>

    <aside>
      <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <h2 style="margin:0">潜水员花名册</h2>
          <button id="addDiverBtn" class="small">新增潜水员</button>
        </div>
        <div id="diverList" style="margin-top:8px"></div>
      </section>

      <section class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h2 style="margin:0">潜次</h2>
          <button id="newDiveBtn" class="small">新建潜次</button>
        </div>
        <div id="diveList" class="dive-list" style="margin-top:8px"></div>
      </section>

      <section class="panel" id="diveDetail"></section>

      <section class="panel">
        <form id="markForm">
          <h2>标记登记 / 更正</h2>
          <input name="id" type="hidden">
          <input name="x" class="pos-row">
          <input name="y" class="pos-row">
          <div class="form-grid">
            <label>编号（潜次内唯一）<input name="code" required></label>
            <label>类型<select name="type">
              <option value="ceramic">陶片</option>
              <option value="wood">木构件</option>
              <option value="metal">金属件</option>
              <option value="unknown">未知物</option>
            </select></label>
            <label>深度(m)<input name="depth" type="number" step="0.1" min="0" required></label>
            <label>朝向<select name="orientation">
              <option value="">请选择</option>
            </select></label>
            <label class="full">保存状态<input name="condition" placeholder="例如：边缘残缺 / 表面附着贝类" required></label>
            <label class="full">备注<textarea name="note"></textarea></label>
          </div>
          <div class="btn-row">
            <button>保存标记</button>
            <button type="button" id="deleteMarkBtn" class="secondary">删除</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar">
          <select id="scope" title="筛选范围">
            <option value="current">仅本潜次</option>
            <option value="all">全部潜次</option>
          </select>
          <select id="typeFilter">
            <option value="">全部类型</option>
            <option value="ceramic">陶片</option>
            <option value="wood">木构件</option>
            <option value="metal">金属件</option>
            <option value="unknown">未知物</option>
          </select>
          <select id="view">
            <option value="list">标记列表</option>
            <option value="timeline">潜次时间线</option>
          </select>
        </div>
        <h2 id="listTitle" style="margin-top:0">标记列表</h2>
        <div id="list" class="list"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script>
    // 填充朝向选项（规则层为单一数据源）
    document.querySelector('[name="orientation"]').innerHTML =
      '<option value="">请选择</option>' +
      DiveRules.ORIENTATIONS.map(o => '<option>' + o + '</option>').join('');
  </script>
  <script src="js/app.js"></script>
</body>
</html>
